# NOTE: triggers are workflow_dispatch ONLY because this account has exhausted
# its GitHub Actions minutes. Run these locally instead (see README "Checks"):
#   Rscript -e 'devtools::test()'
#   Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"))'
#   Rscript -e 'pkgload::load_all("."); testthat::test_file("tests/testthat/test-repo-hygiene.R", package = "urpssim")'
# Re-enable push/pull_request triggers when minutes are available again.
#
# R-CMD-check and repo-hygiene DO now run on push to main and on pull requests,
# on a single ubuntu job each, because they gate correctness. Coverage is a
# reporting metric rather than a gate and catches nothing R CMD check does not,
# so it stays manual until minutes are less scarce.
on:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install pandoc BEFORE setup-r-dependencies -- see R-CMD-check.yaml. Its
      # internal pandoc-needs check resolves Suggests (dependencies = "all") and
      # cannot find the GitHub-only mysterycall; pandoc on PATH short-circuits it.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::testthat, any::pkgload
          # mufflyaccess (Suggests) is a private repo the CI token cannot
          # reach. Hard dependencies only; tests needing it skip themselves.
          dependencies: '"hard"'

      # THE CLASSIFIER IS THE GATE, NOT COVERAGE. Thirty-one tests refuse
      # because per_entering = 1.00 turns a prevalence stock into an annual
      # flow (docs/INCIDENT_ENTRY_ESTIMAND.md). Those refusals are correct and
      # stay red until the parameter is sourced. This step decides whether the
      # run is BLOCKED-but-known or actually broken; it exits non-zero only on
      # an UNDECLARED failure.
      - name: Classify failures (scientific blocker vs infrastructure)
        run: Rscript .github/scripts/classify-failures.R

      # Coverage is measured with failures TOLERATED, because it is a reporting
      # metric rather than a gate -- as this workflow's own header says. The
      # default package_coverage() aborts on the first failing test, which would
      # mean a known scientific refusal silently costs us the coverage number
      # too. Supplying `code` runs the suite with stop_on_failure = FALSE so the
      # measurement still happens; correctness is already decided above.
      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            type = "none",
            code = 'testthat::test_dir("tests/testthat", stop_on_failure = FALSE)',
            quiet = FALSE, clean = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: cobertura.xml
