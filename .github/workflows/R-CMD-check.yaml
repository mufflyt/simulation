# Runs R CMD check on the package. This gate uses error-on: "warning", and three
# consecutive merges reached main in a state that fails it -- a vignette with a
# duplicate chunk label that broke R CMD build outright, two rounds of @export
# tags missing from NAMESPACE, and codoc mismatches -- because nothing ran on
# merge to catch them.
#
# Actions minutes are scarce on this account, so the automatic runs are kept
# deliberately cheap: see the matrix note below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # Automatic runs check ubuntu-release ONLY. macOS bills at a 10x minute
        # multiplier on private repos, and every defect this gate has actually
        # caught shows up on a single Linux run. The full platform matrix still
        # runs on manual dispatch, which is where cross-platform problems belong.
        config: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"},{"os":"macos-latest","r":"release"}]'
          || '[{"os":"ubuntu-latest","r":"release"}]') }}

    env:
      # A token that can read the private mufflyaccess repo. The default
      # GITHUB_TOKEN cannot, and pak then fails the whole job during dependency
      # resolution ("Can't find package called mufflyaccess") before running a
      # single check -- which is why these workflows had never passed.
      GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}
      R_KEEP_PKG_SOURCE: yes
      # Kept as a belt-and-braces: the package must still check when the
      # contract is absent, and the tests that need it skip themselves.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - name: Require the private-dependency token
        # Fail with one readable line instead of a pak backtrace 60 seconds in.
        run: |
          if [ -z "${{ secrets.MUFFLYACCESS_PAT }}" ]; then
            echo "::error::MUFFLYACCESS_PAT secret is not set. pak cannot resolve the" \
                 "private mufflyaccess dependency without it. Add a fine-grained PAT" \
                 "with Contents:Read on mufflyt/mufflyaccess as the repo secret" \
                 "MUFFLYACCESS_PAT."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # Install pandoc BEFORE setup-r-dependencies. That action's internal
      # "does this package need pandoc?" check resolves pak::pkg_deps(".",
      # dependencies = "all") -- which includes Suggests, and so tries to find
      # mysterycall, a GitHub-only Suggests deliberately absent from Remotes
      # (its GLMM graph conflicts with the pinned lme4/blme). With pandoc already
      # on PATH the check short-circuits and never resolves Suggests. Pandoc is
      # needed regardless: knitr/rmarkdown build the vignettes during R CMD check.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # knitr/rmarkdown are the VignetteBuilder. They live in Suggests, which
          # dependencies: "hard" excludes, so R CMD build fails in
          # loadVignetteBuilder() before any check runs. Named explicitly rather
          # than widening to "all", which would drag in sf/arrow for no gain here.
          # mufflyaccess is a Suggests, which dependencies: "hard" does not
          # install -- the Remotes entry only made the ref RESOLVABLE. Named here
          # so it is actually installed, which is the point of the PAT: the
          # roster, SSOT, scenario-registry and projection-contract paths are all
          # gated behind has_mufflyaccess() and have never run in CI.
          #
          # PINNED BY COMMIT, and it has to be spelled out here. Naming the repo
          # bare resolves HEAD: an extra-packages entry is its own spec and does
          # not inherit the DESCRIPTION Remotes pin, so CI would silently install
          # a different build from every developer. That is the exact failure this
          # repository already hit locally -- two builds, both calling themselves
          # 0.10.0, disagreeing about whether n_retired is NA or zero. A version
          # constraint cannot express the difference; only the commit can.
          #
          # test-contract-pin.R asserts this SHA equals MUFFLYACCESS_PINNED_SHA,
          # so the two copies cannot drift apart unnoticed.
          #
          # THE REACHABLE SUGGESTS ARE LISTED INDIVIDUALLY, and they have to be.
          # dependencies: "hard" installs no Suggests at all, which silently
          # disabled twelve tests -- sf (3), survey (4), zipcodeR (3), ggplot2
          # (1), blme/lme4 (1). Each skipped with an honest reason nobody read,
          # so the spatial-access guards, the MEPS care-seeking guards and the
          # coordinate address screen had never run in CI. A skipped gate and a
          # passing gate look identical in the summary line.
          extra-packages: any::rcmdcheck, any::testthat, any::pkgload, any::knitr, any::rmarkdown, any::sf, any::survey, any::zipcodeR, any::ggplot2, any::blme, any::lme4, any::ranger, mufflyt/mufflyaccess@a88dba8f4bafec7659df3f3c1404aca814709208
          # mufflyaccess (Suggests) is a private repo the CI token cannot
          # reach, so Suggests are not resolved wholesale; the reachable ones
          # are named above and tests needing mufflyaccess skip themselves.
          dependencies: '"hard"'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
