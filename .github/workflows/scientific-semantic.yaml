name: Layer 2B - Scientific Semantic Correctness

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scientific-semantic-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Restore renv lockfile
        uses: r-lib/actions/setup-renv@v2

      - name: Run Semantic Correctness & Estimand Contract Tests
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-estimand-semantic-contracts.R")'

      - name: Run Hall-of-Shame Scientific Regression Suite
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-hall-of-shame-regressions.R")'
