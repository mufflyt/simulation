# SCIENTIFIC INTEGRITY — the single required check.
#
# WHAT THIS IS FOR. Branch protection can require one check. Requiring
# `verdict` here makes every scientific contract below blocking without
# maintaining a list of required checks in the GitHub UI, where it drifts
# silently from the workflows it names.
#
# The standard it aims at is stronger than "all tests pass":
#
#   No plausible code change can alter who exists, when they exist, which data
#   created that decision, or the published result, without CI noticing.
#
# WHY EACH CONTRACT IS A SEPARATE JOB rather than one big run. A single job
# reports one result, so a change that breaks the identity gate and a change
# that breaks artifact provenance are indistinguishable in the checks list.
# Separate jobs name the law that broke in the UI, before anyone opens a log.
#
# WHY `verdict` RE-CHECKS RESULTS INSTEAD OF RELYING ON `needs`. A job that is
# SKIPPED or CANCELLED does not fail its dependents by default -- `needs` with
# the default `if` treats the whole downstream as skipped, and a skipped
# required check can be reported as neutral. Only 'success' counts here. This
# is the same idiom as the nightly's "Every blocking gate must have actually
# RUN" step, kept deliberately identical so the two cannot drift.
#
# WHY THE RUNNER IS A SCRIPT. `testthat::test_file()` exiting 0 proves nothing:
# the file may have discovered zero tests, or skipped every one of them.
# .github/scripts/run-scientific-contract.R asserts positively that tests were
# discovered AND that assertions actually passed, and fails otherwise.
#
# DELIBERATELY NOT INCLUDED: the canonical readiness audit
# (.github/scripts/assert-canonical-science.R). It is RED BY DESIGN and stays
# red until an unresolved parameter is sourced -- see the note in
# tests/testthat/helper-setup.R. Putting a permanently-red gate inside a
# required check trains everybody to merge past a red required check, which is
# worse than not having one. It remains blocking in the nightly, where its
# redness is the message rather than an obstacle.
#
# Also not here: the platform matrix, coverage, the frozen restore and the full
# suite. Those are slow and live in the nightly; this workflow is the subset
# whose failure means a scientific law was broken, and it must be fast enough
# that nobody is tempted to skip it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

name: scientific-integrity

permissions:
  contents: read

env:
  R_KEEP_PKG_SOURCE: yes
  _R_CHECK_FORCE_SUGGESTS_: false
  NOT_CRAN: true
  TZ: UTC
  RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest

jobs:
  # ---------------------------------------------------------------------------
  # Each job is one scientific law. The `contract` input is what appears in the
  # error annotation, so it should read as the law, not as a file name.
  # ---------------------------------------------------------------------------
  contracts:
    name: ${{ matrix.contract }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one broken law must not hide the others
      matrix:
        include:
          - contract: identity gate and provider-year state machine
            files: test-retirement-state-machine.R
          - contract: artifact provenance and confidence schema
            files: test-retirement-artifact.R
          - contract: out-of-sample calibration gate
            files: test-retirement-oos-gate.R
          - contract: boundary and decision-surface values
            files: test-scientific-bva.R
          - contract: historical defect regressions
            files: test-hall-of-shame-regressions.R test-config-extdata-sync.R
    env:
      # DELIBERATELY IDENTICAL TO scientific-bva.yaml. The first version of
      # this workflow omitted both the PAT and the explicit mufflyaccess pin
      # and every contract failed in ~70s with "Could not solve package
      # dependencies: local::. Can't install dependency mysterycall" --
      # mysterycall sits in Suggests with no entry in Remotes, so pak cannot
      # resolve the graph unless the private remote is reachable and pinned.
      # Diverging from the proven setup here buys nothing and costs a red
      # required check on every PR.
      GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload, mufflyt/mufflyaccess@9d13b2e197c4a95cfdae3e3520e07d309e8ad9bc
          dependencies: '"hard"'
      - name: Report how this environment was built
        # A warm cache concealed an unsolvable dependency graph for months (see
        # .github/workflows/cold-install.yaml). This does not re-solve anything
        # -- it records what the run is standing on, so "it passed" can be read
        # together with "and the graph was/was not actually solved here".
        # cold-install.yaml is the authoritative clean resolution.
        run: |
          Rscript -e '
            installed <- rownames(installed.packages())
            cat("library packages:", length(installed), "\n")
            suggested_remote <- "mysterycall" %in% installed
            cat("mysterycall present:", suggested_remote, "\n")
            cat(if (suggested_remote)
              "MODE: full graph available (Suggests remotes resolved or restored)\n"
            else
              "MODE: hard-dependency subset only; Suggests remotes not present here\n")
          '

      - name: Enforce the contract
        run: >
          Rscript .github/scripts/run-scientific-contract.R
          "${{ matrix.contract }}" ${{ matrix.files }}

  # ---------------------------------------------------------------------------
  # Every recorded failure must be enforced by a test or carry a written
  # waiver. The invariant is the RATIO, not a count of tests, so this cannot be
  # satisfied by adding unrelated coverage.
  # ---------------------------------------------------------------------------
  hall-of-shame-coverage:
    name: hall-of-shame coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - name: Every recorded failure is enforced or explicitly waived
        # No package dependencies: this reads the registry, the test tags and
        # the waiver file as text, so it stays green even when the dependency
        # graph is broken -- which is exactly when it is most useful.
        run: Rscript .github/scripts/hall-of-shame-coverage.R --check

  # ---------------------------------------------------------------------------
  # A rendered manuscript table must still agree with the artifact that made
  # it. Drift here is invisible on inspection: the table is full of plausible
  # numbers either way.
  # ---------------------------------------------------------------------------
  manuscript-sync:
    name: manuscript / artifact sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - name: Rendered tables match their generated panels
        # Base R only, like the coverage gate: it must survive a broken
        # dependency graph, since a manuscript can be wrong while the package
        # will not install.
        run: Rscript .github/scripts/manuscript-artifact-sync.R --check

  # ---------------------------------------------------------------------------
  # THE REQUIRED CHECK. Point branch protection at this job and nothing else.
  # ---------------------------------------------------------------------------
  verdict:
    name: scientific-integrity
    needs: [contracts, hall-of-shame-coverage, manuscript-sync]
    if: always()   # must run even when a contract failed, or it reports nothing
    runs-on: ubuntu-latest
    steps:
      - name: Every scientific contract must have actually held
        # 'skipped' and 'cancelled' are failures here. A law that did not run
        # is not a law that passed, and a required check that goes green on a
        # skip is exactly the "green means tests actually ran" defect this
        # workflow exists to close.
        run: |
          fail=0
          check() {
            case "$2" in
              success) echo "  OK       $1" ;;
              *) echo "::error::SCIENTIFIC LAW NOT ESTABLISHED: $1 (result=$2)"; fail=1 ;;
            esac
          }
          check "scientific contracts"    "${{ needs.contracts.result }}"
          check "hall-of-shame coverage"  "${{ needs.hall-of-shame-coverage.result }}"
          check "manuscript / artifact sync" "${{ needs.manuscript-sync.result }}"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Skipped counts as failed: a law that did not run did not pass."
            exit 1
          fi
          echo "All scientific contracts held."
