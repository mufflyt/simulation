name: Layer 2E - Scientific Boundary & Decision-Surface Validation (BVA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scientific-boundary-validation:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install System Dependencies for Spatial Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Restore dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::sf, any::survey, any::zipcodeR, mufflyt/mufflyaccess@9d13b2e197c4a95cfdae3e3520e07d309e8ad9bc
          dependencies: '"hard"'

      - name: Execute Boundary-Value Analysis Unit Tests
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-scientific-bva.R")'
