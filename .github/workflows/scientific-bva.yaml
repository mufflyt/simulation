name: Layer 2E - Scientific Boundary & Decision-Surface Validation (BVA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scientific-boundary-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # renv::restore() install-tests every locked package, including terra (via
      # the tigris/sf geospatial stack). setup-renv does NOT install system
      # libraries the way setup-r-dependencies does, so terra.so fails to load
      # with "libproj.so.25: cannot open shared object file" unless the PROJ/GDAL/
      # GEOS/udunits system libraries are present. Install them before restore.
      - name: Install geospatial system libraries (terra/sf)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Restore renv lockfile
        uses: r-lib/actions/setup-renv@v2

      - name: Execute Boundary-Value Analysis Unit Tests
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-scientific-bva.R")'
