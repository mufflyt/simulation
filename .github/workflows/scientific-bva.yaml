name: Layer 2E - Scientific Boundary & Decision-Surface Validation (BVA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scientific-boundary-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install System Dependencies for Spatial Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Restore renv lockfile
        uses: r-lib/actions/setup-renv@v2

      - name: Execute Boundary-Value Analysis Unit Tests
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-scientific-bva.R")'
