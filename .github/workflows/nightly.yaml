# NIGHTLY — the thorough one.
#
# WHY THIS EXISTS SEPARATELY. The per-push gates are deliberately cheap: one
# ubuntu job each, because they run on every merge. This runs once a night and
# is allowed to be expensive. It is where the full platform matrix, the whole
# test suite, coverage, the leak scanners and the refusal-gate audit live.
#
# COST. This repository is PUBLIC, so GitHub-hosted standard runners are free
# and unmetered. The "Actions minutes are scarce / exhausted" notes in the older
# workflows predate that and do not apply here. Nothing below needs rationing.
#
# SCHEDULE. 03:17 MST == 10:17 UTC. GitHub cron is UTC-only and does not observe
# DST, so during Mountain Daylight Time (Mar-Nov) this lands at 04:17 local.
# That is the accepted trade for a single stable schedule; the alternative is
# two crons and a double-run on the changeover days.
#
# FAILURE. Every job feeds the `report` job, which opens (or updates) a single
# tracking issue rather than one per job per night.

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      skip_matrix:
        description: 'Skip the full platform matrix (faster manual run)'
        type: boolean
        default: false

name: nightly

permissions:
  contents: read

# EVERY `run:` STEP USES bash WITH pipefail.
#
# GitHub's default shell is `bash -e {0}` -- WITHOUT pipefail. A pipeline's exit
# status is its LAST command's, so
#
#     run: Rscript .github/scripts/assert-canonical-science.R | tee -a "$GITHUB_STEP_SUMMARY"
#
# reported SUCCESS while the script exited 1. The readiness gate printed
# "CANONICAL CONFIGURATION IS NOT SCIENTIFICALLY RUNNABLE" and four
# ::SCIENTIFIC-BLOCKER:: markers, and the job went green. tee succeeded, so the
# step succeeded.
#
# Twelve piped steps across three workflows had this, including
# assert-scientific-invariants and assert-temporal-integrity. Any of them could
# have been failing silently for as long as they have existed -- a gate that
# cannot fail is not a gate, and its green tells you nothing.
#
# `shell: bash` makes Actions use `bash --noprofile --norc -eo pipefail {0}`.
defaults:
  run:
    shell: bash

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  R_KEEP_PKG_SOURCE: yes
  _R_CHECK_FORCE_SUGGESTS_: false
  # See R-CMD-check.yaml: the default GITHUB_TOKEN cannot read the private
  # mufflyaccess repo and pak fails during dependency resolution without this.
  GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}
  # Pinned by commit, NOT by ref. An extra-packages entry does not inherit the
  # DESCRIPTION Remotes pin, so a bare repo name silently installs HEAD and CI
  # drifts from every developer. test-contract-pin.R asserts this SHA.
  MUFFLYACCESS_PIN: mufflyt/mufflyaccess@9d13b2e197c4a95cfdae3e3520e07d309e8ad9bc
  R_EXTRA_PKGS: any::rcmdcheck, any::testthat, any::pkgload, any::knitr, any::rmarkdown, any::sf, any::survey, any::zipcodeR, any::ggplot2, any::blme, any::lme4

jobs:
  # ---------------------------------------------------------------------------
  # 0. FROZEN RESTORE. The reproducibility premise: can the exact scientific
  #    environment recorded at this commit still be rebuilt on a clean machine?
  #    Deliberately CACHE-FREE -- a cache can rescue an incomplete lockfile and
  #    make an unreproducible environment look reproducible.
  # ---------------------------------------------------------------------------
  frozen-restore:
    name: frozen renv restore (no cache)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          # Match the R version recorded in renv.lock. Restoring a lockfile
          # under a different minor R version installs different binaries.
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Restore exactly from renv.lock into an empty library
        env:
          GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}
          RENV_PATHS_CACHE: ''          # no cache: prove the lockfile alone suffices
          RENV_CONFIG_CACHE_ENABLED: 'FALSE'
        run: |
          # terra/sf link against GDAL, GEOS and PROJ. Without them the
          # restore aborts partway with "error testing if 'terra' can be
          # loaded", leaves the library incomplete, and the smoke test that
          # follows reports the far more confusing "there is no package called
          # pkgload". setup-r-dependencies normally resolves sysreqs, but this
          # job deliberately does not use it -- the whole point is to restore
          # from renv.lock alone -- so the system layer must be named here.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
          mkdir -p "$RUNNER_TEMP/frozenlib"
          Rscript -e '
            lib <- file.path(Sys.getenv("RUNNER_TEMP"), "frozenlib")
            # renv must be installed INTO the frozen library, not the default
            # user library. .libPaths(lib) REPLACES the search path rather than
            # extending it, so a renv installed elsewhere becomes unreachable
            # the moment the path is narrowed -- restore then died with "there
            # is no package called renv", the library stayed empty, and the
            # smoke test that followed reported the far more confusing "there is
            # no package called pkgload". The gate looked like a lockfile defect
            # when it was a library-path defect.
            #
            # Prepending lib to the EXISTING path would also fix the load, but
            # it would let packages already present in the default library
            # satisfy the lockfile, which is precisely what this job exists to
            # rule out. Installing renv into lib keeps the library empty of
            # everything except the restorer itself.
            install.packages("renv", repos = "https://cloud.r-project.org", lib = lib)
            .libPaths(lib)
            renv::restore(project = ".", library = lib, prompt = FALSE)
            cat("\n## Frozen restore\n\ninstalled:", length(list.files(lib)), "packages\n")
            print(utils::sessionInfo())
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The restored library must actually run the model
        env:
          GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}
        run: |
          Rscript -e '
            .libPaths(file.path(Sys.getenv("RUNNER_TEMP"), "frozenlib"))
            suppressMessages(pkgload::load_all(".", quiet = TRUE))
            # Structural smoke test: does the restored library RUN the model?
            # The shipped pathway is refused by assert_incident_not_prevalent()
            # (per_entering = 1.00 is a stock-as-flow error), so this uses the
            # labelled fixture -- NOT a candidate value. See
            # .github/scripts/_pathway_fixture.R.
            source(".github/scripts/_pathway_fixture.R")
            v <- pathway_service_volumes(treated = c(pop = 1000), year = 2025L,
                                         pathway = ci_pathway_fixture())
            stopifnot(nrow(v) > 0, all(is.finite(v$volume)))
            cat("PASS: model runs in the frozen library\n")
          '
      - name: renv diagnostics (always, for triage)
        if: always()
        run: Rscript -e 'renv::diagnostics()' || true

  # ---------------------------------------------------------------------------
  # 1. LEAK GUARDS. No R toolchain, so these finish in seconds and tell you the
  #    single most important thing about a public clinical repo before anything
  #    slower runs.
  # ---------------------------------------------------------------------------
  leak-guard:
    name: leak guard (secrets, PHI, DUA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history scanning needs the whole history

      - name: PHI / DUA scan — working tree
        run: .github/scripts/scan-phi-dua.sh worktree

      - name: PHI / DUA scan — full git history
        # A public repo ships deleted blobs. HEAD being clean proves nothing.
        run: .github/scripts/scan-phi-dua.sh history

      - name: gitleaks (credentials, tokens, keys)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: .gitignore still covers restricted data
        # These rules are what keep CHIA source files and PHI out. If one is
        # deleted the scanners above would only catch it AFTER something leaked.
        run: |
          fail=0
          for pat in '*.rds' '*.mdb'; do
            grep -qF -- "$pat" .gitignore || { echo "::error::.gitignore no longer ignores $pat"; fail=1; }
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # 2. REFUSAL GATES. The audit that ordinary tests cannot do: proving the
  #    guardrails still say NO.
  # ---------------------------------------------------------------------------
  refusal-gates:
    name: refusal gates still refuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      # setup-pandoc BEFORE setup-r-dependencies: that action resolves Suggests
      # in its pandoc-needs check otherwise, and trips over mysterycall (a
      # GitHub-only Suggests deliberately absent from Remotes). Enforced by
      # test-repo-hygiene.R.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_EXTRA_PKGS }}, ${{ env.MUFFLYACCESS_PIN }}
          dependencies: '"hard"'
      - name: Assert every refusal gate still refuses
        run: Rscript .github/scripts/assert-refusal-gates.R

  # ---------------------------------------------------------------------------
  # 2b. SCIENTIFIC INVARIANTS. The failure domain unit tests cannot reach: a
  #     model can be numerically stable, reproducible and completely wrong.
  #     Probability legality, cascade mass balance, an INDEPENDENT reference
  #     implementation, numerical integrity, directional scenario invariants,
  #     and a back-test regression ratchet.
  # ---------------------------------------------------------------------------
  scientific-invariants:
    name: scientific invariants & readiness audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_EXTRA_PKGS }}, ${{ env.MUFFLYACCESS_PIN }}
          dependencies: '"hard"'
      - name: Assert scientific invariants
        run: Rscript .github/scripts/assert-scientific-invariants.R | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assert temporal integrity (no future-data leakage)
        run: Rscript .github/scripts/assert-temporal-integrity.R | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit canonical scientific readiness & blockers
        id: readiness
        # THE STATUS CHECK BELOW WAS UNREACHABLE. This job runs under
        # `bash -eo pipefail` (see `defaults:`), so a non-zero Rscript aborted
        # the step AT THE PIPELINE -- before `status="${PIPESTATUS[0]}"` was
        # ever evaluated. The script has always distinguished exit 1 (the known,
        # declared scientific blocker) from exit 2 (infrastructure or integrity
        # failure), and that distinction was dead code: every run reported a
        # bare "Process completed with exit code 1", and the exit-2 message
        # below had never once been printed.
        #
        # `set +e` around the pipeline restores it. This does NOT make the gate
        # green -- a declared blocker still fails the job, deliberately. What it
        # restores is the ability to say WHICH kind of failure it is, so an
        # unresolved estimand stops looking identical to a broken repository.
        run: |
          set +e
          Rscript .github/scripts/assert-canonical-science.R | tee -a "$GITHUB_STEP_SUMMARY"
          status="${PIPESTATUS[0]}"
          set -e
          echo "readiness_status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 2 ]; then
            echo "::error::assert-canonical-science.R exited 2 -- infrastructure or integrity failure, NOT the known scientific blocker. The repository is broken."
            echo "canonical_state=BROKEN" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          if [ "$status" -eq 1 ]; then
            # Exit 1 is the declared blocker. It is expected, it is not a
            # regression, and the ::SCIENTIFIC-BLOCKER:: markers above name
            # exactly which parameter and which data source would clear it.
            echo "::warning::BLOCKED (expected): the canonical parameterization rests on an unresolved scientific estimand. See the ::SCIENTIFIC-BLOCKER:: markers above. This is not a software failure."
            echo "canonical_state=BLOCKED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "canonical_state=READY" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Generate scientific scorecard
        run: |
          Rscript -e '
            suppressMessages(pkgload::load_all(".", quiet = TRUE))
            scorecard <- generate_scientific_scorecard()
            cat("\n## Scientific Scorecard\n\n")
            for (cat in names(scorecard)) {
              cat(sprintf("- **%s**: %s\n", cat, scorecard[[cat]]))
            }
            cat("\n*", attr(scorecard, "explanation"), "*\n")
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assert BVA boundaries & mutation recovery suite
        run: |
          Rscript -e '
            suppressMessages(pkgload::load_all(".", quiet = TRUE))
            bds <- read_scientific_boundaries()
            cat(sprintf("Loaded %d scientific boundaries for BVA analysis.\n", length(bds)))
            muts <- SCIENTIFIC_MUTATION_MANIFEST
            results <- lapply(muts$id, test_scientific_mutation)
            killed_count <- sum(vapply(results, function(r) r$killed, logical(1)))
            cat(sprintf("Scientific Mutation Recovery: %d of %d mutations killed (%.0f%% recovery rate).\n", killed_count, nrow(muts), 100 * killed_count / nrow(muts)))
            if (killed_count < nrow(muts)) quit(status = 1)
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit CHIA physician-attribution database (test_chia.py)
        # The CHIA Case Mix DuckDB is 10GB+ on a personal external drive and
        # is not, and will not be, present on a GitHub-hosted runner -- this
        # step skips cleanly there today. It exists so the audit runs for
        # real the moment the data IS reachable (a self-hosted runner with
        # the drive attached, or a manual workflow_dispatch with
        # URPS_CHIA_DUCKDB set), rather than needing to be wired up from
        # scratch at that point. See scripts/chia/test_chia.py's own
        # docstring: exit code is 1 if any GATE fails.
        #
        # KNOWN, PRE-EXISTING GAP, not a regression: test_chia.py currently
        # errors (not a clean GATE failure) on its revenue-code checks,
        # which need a `ref` schema this repo's CADR build has never
        # populated -- a separate workstream from the physician-attribution
        # work (R/data-chia_physician_attribution.R) this step is meant to
        # cover. Narrowing test_chia.py's own scope, or building the ref
        # schema, is future work, not something to paper over here.
        run: |
          DB="${URPS_CHIA_DUCKDB:-/Volumes/MufflySamsung/DuckDB/chia_cadr.duckdb}"
          if [ ! -f "$DB" ]; then
            echo "SKIP: CHIA Case Mix DuckDB not present at $DB (expected on GitHub-hosted runners)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/chia/test_chia.py --db "$DB" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. FULL PLATFORM MATRIX. The per-push gate checks ubuntu-release only.
  # ---------------------------------------------------------------------------
  matrix-check:
    name: R CMD check ${{ matrix.config.os }} (${{ matrix.config.r }})
    if: ${{ !inputs.skip_matrix }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'devel'   }
          - { os: ubuntu-latest,  r: 'oldrel-1' }
          - { os: macos-latest,   r: 'release' }
          - { os: windows-latest, r: 'release' }
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          http-user-agent: ${{ matrix.config.r == 'devel' && 'release' || 'default' }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_EXTRA_PKGS }}, ${{ env.MUFFLYACCESS_PIN }}
          dependencies: '"hard"'
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  # ---------------------------------------------------------------------------
  # 4. FULL SUITE WITH SKIP ACCOUNTING. A skipped gate and a passing gate look
  #    identical in a summary line; twelve tests were once silently disabled by
  #    a dependency change. This prints every skip and its reason.
  # ---------------------------------------------------------------------------
  full-suite:
    name: full test suite (+ skip accounting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_EXTRA_PKGS }}, ${{ env.MUFFLYACCESS_PIN }}
          dependencies: '"hard"'
      - name: Run the suite and account for every skip
        run: |
          Rscript -e '
            suppressMessages(pkgload::load_all(".", quiet = TRUE))
            t0 <- Sys.time()
            res <- testthat::test_dir("tests/testthat", reporter = "silent",
                                      stop_on_failure = FALSE)
            df <- as.data.frame(res)
            mins <- as.numeric(difftime(Sys.time(), t0, units = "mins"))
            cat(sprintf("\n## Suite\n\nblocks %d | passed %d | failed %d | errors %d | skipped %d | %.1f min\n",
                        nrow(df), sum(df$passed), sum(df$failed), sum(df$error),
                        sum(df$skipped), mins))
            bad <- df[df$failed > 0 | df$error > 0, c("file","failed","error")]
            if (nrow(bad)) { cat("\nFAILING FILES\n"); print(bad, row.names = FALSE) }
            sk <- df[df$skipped > 0, c("file","skipped")]
            if (nrow(sk)) {
              cat("\nSKIPPED (a skipped gate is not a passing gate)\n")
              print(sk, row.names = FALSE)
            }
            # ORDINARY SEMANTICS, DELIBERATELY RESTORED. A failing test fails
            # the job -- full stop. An earlier revision let a blocker registry
            # decide the exit status, which would have meant a green build with
            # tests failing. The expected scientific refusals are now asserted
            # as PASSING tests of refusal, so there is nothing left to excuse.
            if (sum(df$failed) + sum(df$error) > 0) quit(status = 1)
          ' | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. DETERMINISM. A microsimulation that does not reproduce under a fixed seed
  #    cannot support a published number.
  # ---------------------------------------------------------------------------
  reproducibility:
    name: seeded runs reproduce exactly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_EXTRA_PKGS }}, ${{ env.MUFFLYACCESS_PIN }}
          dependencies: '"hard"'
      - name: Same seed twice must be bit-identical
        run: |
          Rscript -e '
            suppressMessages(pkgload::load_all(".", quiet = TRUE))
            # Determinism, not calibration: the question is whether one seed
            # gives one answer. Uses the labelled fixture because the shipped
            # pathway is refused -- see .github/scripts/_pathway_fixture.R.
            source(".github/scripts/_pathway_fixture.R")
            one <- function() {
              set.seed(20260815)
              v <- pathway_service_volumes(
                treated = c(pop = 3264807, ui = 2538779, ai = 372721),
                year = 2025L, pathway = ci_pathway_fixture())
              v[order(v$service), ]
            }
            a <- one(); b <- one()
            if (!isTRUE(all.equal(a, b))) {
              cat("::error::identical seeds produced different volumes\n"); quit(status = 1)
            }
            cat("PASS: seeded pathway volumes reproduce exactly\n")
            cat(sprintf("digest: %s\n", digest::digest(a)))
          '
      - name: Practice economics reproduces exactly and stays finite
        # simulate_practice_economics() draws its own Monte Carlo uncertainty
        # (overhead, malpractice, commercial ratio, transition probabilities)
        # on top of the pipeline's existing stochastic steps -- a new source
        # of randomness this job's premise ("one seed gives one answer") had
        # not yet covered. run_practice_economics defaults to FALSE, so this
        # is the only nightly check that exercises the opt-in path at all.
        run: |
          Rscript -e '
            suppressMessages(pkgload::load_all(".", quiet = TRUE))
            one <- function() {
              run_end_to_end_simulation(
                start_year = 2025L, end_year = 2026L,
                n_agents = 100L, initial_provider_count = 100L,
                fellowship_entrants = 5L, save_outputs = FALSE,
                run_practice_economics = TRUE, seed = 20260821L
              )$practice_economics_diagnostics
            }
            a <- one(); b <- one()
            if (!isTRUE(all.equal(a, b))) {
              cat("::error::identical seeds produced different practice-economics diagnostics\n")
              quit(status = 1)
            }
            stopifnot(
              nrow(a) == 2L,
              all(a$n_practices > 0),
              all(is.finite(a$mean_operating_margin)),
              all(a$mean_loss_probability >= 0 & a$mean_loss_probability <= 1),
              all(a$mean_acquisition_probability >= 0 & a$mean_acquisition_probability <= 1),
              all(a$mean_cash_pay_probability >= 0 & a$mean_cash_pay_probability <= 1)
            )
            cat("PASS: practice economics diagnostics reproduce exactly and stay in-bounds\n")
            cat(sprintf("digest: %s\n", digest::digest(a)))
          '

  # ---------------------------------------------------------------------------
  # 6. COVERAGE, LINT, DOCS. Reporting rather than correctness, hence nightly.
  # ---------------------------------------------------------------------------
  quality:
    name: coverage / lint / docs
    runs-on: ubuntu-latest
    continue-on-error: true   # informational; must not mask a real failure above
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_EXTRA_PKGS }}, ${{ env.MUFFLYACCESS_PIN }}, any::covr, any::lintr, any::spelling, any::urlchecker, roxygen2@8.0.0
          dependencies: '"hard"'

      - name: Coverage
        run: |
          Rscript -e '
            cov <- covr::package_coverage(quiet = TRUE)
            pct <- covr::percent_coverage(cov)
            cat(sprintf("\n## Coverage\n\n%.1f%%\n", pct))
            print(covr::coverage_to_list(cov)$filecoverage[1:20])
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: Rscript -e 'print(lintr::lint_package())'

      - name: roxygen documentation is up to date
        # Regenerate and fail if man/ or NAMESPACE would change. Two merges once
        # reached main with @export tags missing from NAMESPACE.
        #
        # roxygen2 IS PINNED ABOVE, and the pin is part of the contract: an
        # unpinned `any::roxygen2` installs whatever is current and rewrites all
        # ~500 .Rd files on a version bump, reporting "stale" against docs that
        # were perfectly current for the declared generator.
        #
        # PIN MOVED 7.3.3 -> 8.0.0 (2026-08-29). It had drifted from reality
        # rather than holding the line: DESCRIPTION already carried
        # `Config/roxygen2/version: 8.0.0` from a partial regeneration, so man/
        # was a MIXTURE of both generators and neither reproduced it. Measured on
        # the committed tree, 7.3.3 rewrote 783 files and 8.0.0 rewrote 83, so
        # 8.0.0 is both the smaller diff and the generator developers actually
        # run. Pinning to the older one meant every local regeneration re-broke
        # this gate.
        #
        # The version is still declared in exactly one place; that place now
        # names 8.0.0.
        run: |
          # PROVENANCE FIRST. "Stale" is not actionable without knowing which
          # generator produced the committed files and which produced the
          # comparison. RoxygenNote pins roxygen2; R itself is NOT pinned here,
          # and whether R version materially changes generated bytes is exactly
          # what this reports.
          {
            echo "## Documentation generation environment"
            echo '```'
            Rscript -e 'cat("R           :", R.version.string, "\n");
                        cat("roxygen2    :", as.character(packageVersion("roxygen2")), "\n");
                        d <- read.dcf("DESCRIPTION");
                        cat("RoxygenNote :", d[1, "RoxygenNote"], "\n")'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          Rscript -e 'roxygen2::roxygenise()'

          # BYTE-STABILITY, MEASURED ON A COPY. The first version of this probe
          # stashed man/ and regenerated twice IN THE WORKING TREE with output
          # sent to /dev/null. If either regeneration had errored, the tree
          # would sit at the committed state and the staleness check below
          # would pass VACUOUSLY -- a diagnostic that destroys what it measures.
          # It runs in a scratch copy now, and errors are fatal rather than
          # swallowed.
          rm -rf /tmp/roxcheck && cp -a . /tmp/roxcheck
          ( cd /tmp/roxcheck \
            && Rscript -e 'roxygen2::roxygenise()' \
            && cp -a man /tmp/rox_pass1 && cp NAMESPACE /tmp/rox_ns1 \
            && Rscript -e 'roxygen2::roxygenise()' ) || {
              echo "::error::roxygenise() FAILED during the stability probe" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
          if diff -r -q /tmp/rox_pass1 /tmp/roxcheck/man >/dev/null 2>&1 && \
             diff -q /tmp/rox_ns1 /tmp/roxcheck/NAMESPACE >/dev/null 2>&1; then
            echo "regeneration is byte-stable within this environment" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::roxygen output is NONDETERMINISTIC in a single environment" >> "$GITHUB_STEP_SUMMARY"
          fi

          if ! git diff --quiet -- man NAMESPACE; then
            echo "::error::man/ or NAMESPACE is stale. Run roxygen2::roxygenise() and commit."
            # WRITE THE DIFF TO THE STEP SUMMARY, not only to the log. The log
            # interleaves all jobs, and this step's output proved unrecoverable
            # from it -- the gate said "stale" and could not say WHAT, which is
            # a gate that reports a problem without reporting the problem.
            {
              echo "## Stale generated docs"
              echo '```'
              git --no-pager diff --stat -- man NAMESPACE
              echo '```'
              echo "<details><summary>full diff</summary>"
              echo '```diff'
              git --no-pager diff -- man NAMESPACE | head -200
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff --stat -- man NAMESPACE
            exit 1
          fi

      - name: Spelling
        run: Rscript -e 'spelling::spell_check_package()'

      - name: URLs resolve
        run: Rscript -e 'urlchecker::url_check()'

  # ---------------------------------------------------------------------------
  # 7. REPORT. One tracking issue, updated — not one issue per job per night.
  # ---------------------------------------------------------------------------
  report:
    name: nightly report
    runs-on: ubuntu-latest
    needs: [frozen-restore, leak-guard, refusal-gates, scientific-invariants, matrix-check, full-suite, reproducibility, quality]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Summarise
        id: sum
        run: |
          {
            echo "## Nightly $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| frozen restore | ${{ needs.frozen-restore.result }} |"
            echo "| leak guard | ${{ needs.leak-guard.result }} |"
            echo "| refusal gates | ${{ needs.refusal-gates.result }} |"
            echo "| scientific invariants | ${{ needs.scientific-invariants.result }} (see canonical-science note below) |"
            echo "| platform matrix | ${{ needs.matrix-check.result }} |"
            echo "| full suite | ${{ needs.full-suite.result }} |"
            echo "| reproducibility | ${{ needs.reproducibility.result }} |"
            echo "| quality | ${{ needs.quality.result }} |"
            echo
            echo "### Two kinds of red"
            echo
            echo "**RED / action required** -- a software or scientific-integrity gate broke."
            echo "Something that used to hold no longer holds, and somebody has to fix it."
            echo
            echo "**BLOCKED / expected** -- the canonical parameterization rests on a"
            echo "scientific estimand nobody has resolved yet. \`scientific invariants\`"
            echo "fails for this reason today: \`new_consultation/per_entering\` is 1.00,"
            echo "which treats a prevalence STOCK as an annual FLOW. The gate is designed"
            echo "to stay red until the parameter is defined and sourced, so its redness is"
            echo "the message rather than a defect. Grep the log for"
            echo "\`::SCIENTIFIC-BLOCKER::\` to see which parameters and which data source."
            echo
            echo "A blocked canonical model and a broken repository are different states."
            echo "Reporting them identically is how a real regression hides behind a known one."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Every blocking gate must have actually RUN
        # A skipped, cancelled or missing correctness job must not masquerade as
        # green. Only 'success' counts; 'skipped' is a failure for a blocking
        # gate, because the thing it protects went unchecked.
        run: |
          fail=0
          check() {
            case "$2" in
              success) echo "  OK       $1" ;;
              *)       echo "::error::BLOCKING GATE DID NOT PASS: $1 (result=$2)"; fail=1 ;;
            esac
          }
          check "frozen restore"        "${{ needs.frozen-restore.result }}"
          check "leak guard"            "${{ needs.leak-guard.result }}"
          check "refusal gates"         "${{ needs.refusal-gates.result }}"
          # scientific-invariants is deliberately NOT checked here. It carries the
          # canonical-science blocker, which fails by design; asserting it as a
          # correctness gate would mean the nightly can never report a clean
          # software state, and a gate that can never be green is one nobody
          # reads. Its exit-2 case -- infrastructure failure rather than the
          # declared blocker -- is caught inside the job itself, which is where
          # the two can actually be told apart.
          case "${{ needs.scientific-invariants.result }}" in
            success) echo "  OK       canonical science (READY -- blocker cleared)" ;;
            failure) echo "  BLOCKED  canonical science (expected; see ::SCIENTIFIC-BLOCKER:: markers)" ;;
            *)       echo "::error::canonical science job did not run (result=${{ needs.scientific-invariants.result }})"; fail=1 ;;
          esac
          check "full suite"            "${{ needs.full-suite.result }}"
          check "reproducibility"       "${{ needs.reproducibility.result }}"
          # matrix-check is skipped only by explicit workflow_dispatch opt-out
          if [ "${{ needs.matrix-check.result }}" != "success" ] && [ "${{ inputs.skip_matrix }}" != "true" ]; then
            echo "::error::BLOCKING GATE DID NOT PASS: platform matrix (result=${{ needs.matrix-check.result }})"
            fail=1
          fi
          exit $fail

      - name: Open or update the tracking issue on failure
        # scientific-invariants is DELIBERATELY EXCLUDED from this trigger. It
        # is red by design (see the comment on that job below and in
        # scientific-integrity.yaml) -- blocked on real longitudinal claims
        # data that has not been sourced, not a bug -- and stays that way for
        # an extended, known period. Including it here meant this step fired
        # on EVERY nightly run regardless of anything else, and on a night
        # where nothing else failed it posted a comment reading "**Failing:**"
        # with nothing after it, to a single growing tracking issue: 17
        # comments in 11 days, most non-actionable. Its redness is already
        # visible in the run's own job list and in the summary table below --
        # that is the right place for a permanent, by-design daily reminder.
        # An alert should fire for gates whose failure is actually unexpected.
        #
        # matrix-check is included here even though it is not one of the
        # "Every blocking gate must have actually RUN" checks above (it can be
        # opted out via workflow_dispatch) -- it IS one of the rows in the
        # table this step posts, and before this fix its failures only ever
        # triggered a comment by riding along with scientific-invariants'
        # constant redness. Removing that constant trigger without adding
        # this one would have silently stopped alerting on platform-matrix
        # failures, historically the most common single-item failure here.
        if: ${{ always() && (needs.leak-guard.result != 'success' || needs.refusal-gates.result != 'success' || needs.matrix-check.result != 'success' || needs.full-suite.result != 'success' || needs.reproducibility.result != 'success') }}
        uses: actions/github-script@v7
        with:
          script: |
            const rows = {
              'leak guard': '${{ needs.leak-guard.result }}',
              'refusal gates': '${{ needs.refusal-gates.result }}',
              'platform matrix': '${{ needs.matrix-check.result }}',
              'full suite': '${{ needs.full-suite.result }}',
              'reproducibility': '${{ needs.reproducibility.result }}',
              'quality (informational)': '${{ needs.quality.result }}',
            };
            const failed = Object.entries(rows).filter(([, v]) => v === 'failure').map(([k]) => k);
            const title = 'Nightly CI failing';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              `**Failing:** ${failed.join(', ')}`,
              '',
              '| job | result |', '|---|---|',
              ...Object.entries(rows).map(([k, v]) => `| ${k} | ${v} |`),
              '',
              failed.includes('leak guard')
                ? '> **Leak guard failed on a PUBLIC repository. Treat as urgent** — check for a DUA-restricted file or PHI before anything else.'
                : '',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly'],
              });
            }
