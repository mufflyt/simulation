# Fast structural checks that do not need the full package toolchain: duplicate
# function definitions, hardcoded personal paths, install.packages() in library
# code, and source-time file reads. These guard defects the repository has
# actually had. One ubuntu job with no package build, so it is the cheapest gate
# here and runs automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: repo-hygiene

permissions: read-all

jobs:
  hygiene:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Require the private-dependency token
        run: |
          if [ -z "${{ secrets.MUFFLYACCESS_PAT }}" ]; then
            echo "::error::MUFFLYACCESS_PAT secret is not set."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload, any::dplyr, any::tibble, any::tidyr, any::sf, any::survey, any::zipcodeR, any::ggplot2, any::blme, any::lme4, any::ranger, mufflyt/mufflyaccess@a88dba8f4bafec7659df3f3c1404aca814709208
          dependencies: '"hard"'

      - name: Full suite from the repository root, with the skip budget
        env:
          NOT_CRAN: "true"
        run: |
          set -o pipefail
          Rscript scripts/ci/check_suite.R 2>&1 | tee repo-hygiene.log

      - name: Upload baseline repo-hygiene diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-repo-hygiene-diagnostic
          path: repo-hygiene.log
          if-no-files-found: error
