# Fast structural checks that do not need the full package toolchain: duplicate
# function definitions, hardcoded personal paths, install.packages() in library
# code, and source-time file reads. These guard defects the repository has
# actually had. One ubuntu job with no package build, so it is the cheapest gate
# here and runs automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: repo-hygiene

permissions: read-all

jobs:
  hygiene:
    runs-on: ubuntu-latest

    env:
      # See R-CMD-check.yaml: the default GITHUB_TOKEN cannot read the private
      # mufflyaccess repo, and pak fails the job during dependency resolution.
      GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Require the private-dependency token
        run: |
          if [ -z "${{ secrets.MUFFLYACCESS_PAT }}" ]; then
            echo "::error::MUFFLYACCESS_PAT secret is not set. Add a fine-grained PAT" \
                 "with Contents:Read on mufflyt/mufflyaccess as the repo secret" \
                 "MUFFLYACCESS_PAT."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload, any::dplyr, any::tibble, any::tidyr
          # mufflyaccess (Suggests) is a private repo the CI token cannot
          # reach. Hard dependencies only; tests needing it skip themselves.
          dependencies: '"hard"'

      - name: Structural guards
        run: |
          pkgload::load_all(".", quiet = TRUE)
          res <- testthat::test_file("tests/testthat/test-repo-hygiene.R",
                                     package = "urpssim", stop_on_failure = TRUE)
        shell: Rscript {0}
