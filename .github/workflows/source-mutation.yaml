name: Layer 2C - Source Mutation Resistance

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday deep campaign

jobs:
  source-code-mutation-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Restore renv lockfile
        uses: r-lib/actions/setup-renv@v2

      - name: Execute High-Priority Mutation Test Suite
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-source-mutation-engine.R")'
