name: Layer 2C - Source Mutation Resistance

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday deep campaign

jobs:
  source-code-mutation-campaign:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.MUFFLYACCESS_PAT }}
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install System Dependencies for Spatial Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Restore dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::sf, any::survey, any::zipcodeR, mufflyt/mufflyaccess@a88dba8f4bafec7659df3f3c1404aca814709208
          dependencies: '"hard"'

      - name: Execute High-Priority Mutation Test Suite
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-source-mutation-engine.R")'
