# Canonical Source Registry
# -------------------------------------------------------------------------
# Ported from the isochrones "Trust-a-Number" contract (Non-Negotiable #19):
# every model input has ONE named source here, reached through ONE resolver
# (resolve_canonical() in R/11-canonical_and_joins.R). A wrong-source or
# wrong-grain error is SILENT -- a confident wrong number, not a crash -- so
# never hardcode an input path in a caller; resolve it by logical name.
#
# Each entry is either a bare path (relative to the repo root, or absolute) or a
# mapping with `path` and an optional `sha256`. When `sha256` is present the
# resolver verifies it and STOPS on drift in REPRODUCIBILITY_MODE=strict (warns
# in relaxed). Add a checksum for any file that drives a published number.

sources:
  # Census 2023 National Population Projections, single-year-of-age detail file
  # (np2023_d1_<series>.csv, columns POP_0..POP_100). The demand driver is the
  # projected female population by age band; the SSOT female filter is
  # SEX==2 & ORIGIN==0 & RACE==0 (R/13-demand_urps.R::npp_total_female).
  # Loaded via npp_female_by_band(series). Mid is the primary series; low/hi
  # drive the demand uncertainty band. Source: US Census Bureau, 2023 NPP,
  # Main projections series (www.census.gov/programs-surveys/popproj.html).
  census_npp_female_mid:
    path: data-raw/census/np2023_d1_mid.csv
    sha256: "1532822751d0d08b69bb9947e4f64cb2d2217229000bd7a97997d305b890d16f"
  census_npp_female_low:
    path: data-raw/census/np2023_d1_low.csv
    sha256: "7b780edb10a0d3fa219db9477829c9a2a0a9c8f44708ab828ff52a2f3af971d8"
  census_npp_female_hi:
    path: data-raw/census/np2023_d1_hi.csv
    sha256: "d3ff9d25cc0f1b1425641f9a5512afd335d0d048b3824fbb539e6de14890d5b3"

  # Base-year FPMRS active workforce roster (age-structured; cliff SSOT).
  fpmrs_baseline_roster:
    path: data/fpmrs_baseline_roster.csv
    sha256: ""

  # Isochrone origin coordinates (5 km cluster reps) for the E2SFCA access layer.
  isochrone_origins:
    path: data/isochrone_origins.csv
    sha256: ""

  # Census tract population (demand denominator for the spatial access layer).
  tract_female_population:
    path: data/tract_female_population.csv
    sha256: ""

  # --- Supply-side calibration inputs (vetted, carried from cliff) ----------
  # Empirical age-band departure hazards for URPS (person-years / events /
  # annual_hazard), from cliff's 6-source departure signal validated vs state
  # boards at 94.4% agreement. The 70+ cell is 0 events / 16 person-years -- a
  # sparse artifact, floored on load (see urps_empirical_hazard_by_ageband()).
  urps_retirement_hazard_ageband:
    path: data-raw/calibration/retirement_hazard_by_ageband.csv
    sha256: "7e9fdb4f72c6de193e68d2c6182b33d6b1d166db47a8233877417fba88466d44"
  # Subspecialty-specific + partial-pooled hazards (GO / URPS / MIGS / pooled).
  urps_hazard_pooled:
    path: data-raw/calibration/hazard_by_band_pooled_vs_unpooled.csv
    sha256: "fcc37642e7e289631b291a4225bce91adea3f98dc5655e989742811a0f85521b"
  # Age-productivity curve (rel_to_peak, work_usd) for effective-FTE validation.
  urps_age_productivity:
    path: data-raw/calibration/urps_module_a_age_productivity_2026-07-23.csv
    sha256: "0cb612c56f2b4f8b4ef82e32d0e865d6b7e4f379fda65707471aaa19daef3df5"
  # NRMP filled fellowship positions by subspecialty (real annual entrants).
  urps_nrmp_entrants:
    path: data-raw/calibration/nrmp_fellowship_entrants.csv
    sha256: "1f9cba14d78922d1910ed5008c2d38639e81ef917ad124c82b2c4ca48030a159"
