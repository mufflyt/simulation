# Calibration Targets
# ---------------------------------------------------------------------------
# Independent national anchors the model's base-year predictions are compared
# against, per HDMM Exhibit 11: scalar = national estimate / model prediction.
# A model with no anchor is not calibrated to anything.
#
# Published HDMM office-visit scalars for reference (Exhibit 11):
#   Obstetrics & Gynecology 0.906   Urology 0.728   General Surgery 0.963
#   Orthopedic Surgery      0.243   Pediatrics 1.665
# A scalar far from 1 signals a structural mismatch, not an offset.

max_scalar: 3.0

anchors:
  urps_office_visits:
    source: "NAMCS / MEPS national office-visit totals for urogynecologic care"
    path: data/anchors/urps_office_visits.csv
    sha256: "8e98138bccacbecaa5b29d8c7b458178aee9f6acbc7559fe47721d8876f1b918"
  sling_procedure_volume:
    source: "HCUP SASD (ambulatory surgery) + Medicare Part B carrier, CPT 57288"
    note: "NIS is INPATIENT and carries ICD-10-PCS, not CPT; most slings are outpatient"
    # NOT YET ACQUIRED. Needs the licensed HCUP Central Distributor pull; see
    # data-raw/hcup/README.md. Filename follows the <anchor_id>.csv convention
    # used by the anchors that exist -- note scripts/data_acquisition/
    # 10_ingest_hcup_nass.R currently writes "sling_volume.csv" and would need
    # updating to match.
    path: data/anchors/sling_procedure_volume.csv
    sha256: ""
    status: missing
  prolapse_procedure_volume:
    source: "HCUP SASD + Medicare Part B carrier"
    path: data/anchors/prolapse_procedure_volume.csv
    sha256: "b449fd0131a574681a1a9d1045917f6a44efbe0b3dca585d09e9ef1ff635e312"
  ui_prevalence:
    source: "Nygaard 2008 JAMA; SWAN longitudinal prevalence"
    # NOT YET ACQUIRED.
    path: data/anchors/ui_prevalence.csv
    sha256: ""
    status: missing

# Back-test configuration: fit through fit_through_year, project to target_year,
# compare with observed. Goes beyond the published Dall-family standard, which
# calibrates and cross-checks but does not back-test.
backtest:
  fit_through_year: 2017
  target_year: 2023
  compare:
    - urps_headcount
    - urps_state_distribution
    # Primary historical PROCEDURE comparator. POP (not sling): a national
    # all-payer HCUP 2016-2018 estimate exists and 2017 aligns with the fit
    # window, whereas the national sling comparator is dated and the sling data
    # we own directly are Medicare-FFS (population-limited). Sling stays a
    # calibration anchor and a secondary back-test diagnostic.
    - prolapse_procedure_volume

