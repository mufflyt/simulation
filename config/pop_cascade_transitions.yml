# POP surgical cascade — transition-level estimand gate
# ---------------------------------------------------------------------------
# The external surgical-volume anchor does not constrain the model's output; it
# constrains a TRANSITION. Recording which one, and with what evidence, is the
# difference between calibrating a mechanism and normalising a number.
#
# Every transition carries probability, source, population, vintage, confidence
# and calibration_status. A transition with confidence: low and
# calibration_status: uncalibrated_illustrative is a declared placeholder, not a
# finding.

cascade:
  name: pelvic_organ_prolapse_surgical_pathway
  unit: encounter          # matches prolapse_procedure_volume anchor
  stages:
    - population_pop
    - recognized_symptomatic
    - care_seeking
    - specialty_evaluation
    - conservative_management
    - failed_or_progressed
    - operative_treatment
    - recurrence_reoperation

transitions:
  conservative_to_testing:
    probability: 0.35
    source: expert judgement
    population: treated POP patients
    vintage: unspecified
    confidence: low
    calibration_status: uncalibrated_illustrative
    constrained_by_anchor: partially   # jointly, with testing_to_procedure

  testing_to_procedure:
    probability: 0.55
    source: expert judgement
    population: POP patients completing specialty evaluation
    vintage: unspecified
    confidence: low
    calibration_status: uncalibrated_illustrative
    constrained_by_anchor: partially

  followup_to_recurrence:
    probability: 0.12
    source: expert judgement; SUPeR/E-CARE retreatment curves
    population: POP patients after primary operation
    vintage: unspecified
    confidence: low
    calibration_status: uncalibrated_illustrative
    constrained_by_anchor: no

# ---------------------------------------------------------------------------
# BACK-SOLVED CONSTRAINT from prolapse_procedure_volume (140,762 encounters)
#
# The anchor constrains the PRODUCT of the two advance probabilities, not either
# alone. Recurrence is not independent -- reoperations derive from the procedure
# stage -- so the multiplier is (1 + p_followup x per_entering_recurrence)
# = 1 + 0.12 x 0.40 = 1.048.
#
#   V = N_treated x p_combined x 1.048
#   140,762 = 3,264,807 x p_combined x 1.048
#   p_combined = 0.0411
#
#   current   0.35 x 0.55 = 0.1925  (19.2% of treated operated annually)
#   required                0.0411  ( 4.1%)
#   overstatement           4.68x
#
# Reconciliation options, none adjudicated -- this needs evidence, not algebra:
#   hold conservative_to_testing 0.35  ->  testing_to_procedure  0.1175
#   hold testing_to_procedure    0.55  ->  conservative_to_testing 0.0748
#   scale both equally                 ->  each x 0.462
# ---------------------------------------------------------------------------

anchor_constraint:
  anchor: prolapse_procedure_volume
  observed_encounters: 140762
  treated_population: 3264807
  recurrence_multiplier: 1.048
  current_combined_probability: 0.1925
  required_combined_probability: 0.0411
  overstatement_factor: 4.68
  constrains: product_of(conservative_to_testing, testing_to_procedure)
  resolution_required: pathway_recalibration
  terminal_scalar_applied: false
  requires_pathway_recalibration: true
  note: >
    A terminal scalar of 0.214 would make the reported total match while leaving
    19.2% of treated POP patients being operated on INSIDE the model, where it
    drives FTE, workload and every downstream projection. The number would look
    calibrated and the mechanism would still be wrong.
